<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<section>
        <hr>
    <form style="margin-left: 35vw;margin-right: 45vw;border: 2px solid black;">
    
        <pre>
        <label for="name"  >Name -</label>
        <input type="text" placeholder="Full Name" min="3" required>
   
        <label for="email"  >Email -</label>
        <input type="email" placeholder="test@gmail.com" required>
   
        <label for="age"  >Age -
        </label><input type="text" placeholder="" min="1" required>
  
        <label for="phone"  >Number -</label>
        <input type="text" placeholder="98765-43210"  pattern="[0-9]{5}-[0-9]{5}" required>

        <label for="pass"  >Password -</label>
        <input type="password" placeholder="Pass" min="6" >
 
        <label for="cpass"  >Confirm Password -</label>
        <input type="password" placeholder="Confirm Pass" min="6" >
      
        <label for="gender"  >Gender -</label>
        <input type="radio" name="gender">Male
        <input type="radio" name="gender">Female
      
                
              <button>Submit</button>
                </pre>
    </form>
    <hr>
</section>
</body>
</html>
